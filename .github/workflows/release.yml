name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: tag matches the Info.plist
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${declared}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: check
        run: make check

      - name: build
        run: ./build.sh "${{ steps.version.outputs.version }}"

      - name: package
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="GiGi-$version-macos-$(uname -m)"
          stage="dist/$name"
          mkdir -p "$stage"
          cp -R app/GiGi.app "$stage/"
          cp bin/gigi install.sh uninstall.sh README.md "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$name.zip"
          shasum -a 256 "$name.zip" | tee "$name.zip.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: verify the artifact
        run: |
          set -euo pipefail
          name="${{ steps.package.outputs.name }}"
          shasum -a 256 -c "$name.zip.sha256"
          rm -rf dist/unpacked
          unzip -q "$name.zip" -d dist/unpacked
          codesign --verify --strict "dist/unpacked/$name/GiGi.app"
          plutil -extract CFBundleShortVersionString raw "dist/unpacked/$name/GiGi.app/Contents/Info.plist" \
            | grep -qx "${{ steps.version.outputs.version }}"

      - name: notes
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "### Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..$GITHUB_REF_NAME"
              echo
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty='- %s' "$GITHUB_REF_NAME"
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "unzip ${{ steps.package.outputs.name }}.zip"
            echo "cd ${{ steps.package.outputs.name }}"
            echo "./install.sh --app"
            echo '```'
            echo
            echo "Grant Accessibility in System Settings > Privacy & Security > Accessibility,"
            echo "otherwise the display stays awake but the cursor never moves."
            echo
            echo "### macOS security"
            echo
            echo "The bundle is ad-hoc signed, so Gatekeeper quarantines it on first open:"
            echo "right-click GiGi.app and choose Open, or run"
            echo '`xattr -dr com.apple.quarantine GiGi.app` before opening it.'
          } > dist/notes.md
          cat dist/notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "GiGi ${{ steps.version.outputs.version }}" \
            --notes-file dist/notes.md \
            "${{ steps.package.outputs.name }}.zip" \
            "${{ steps.package.outputs.name }}.zip.sha256"
